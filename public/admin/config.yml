# public/admin/config.yml
#
# Non-negotiable: backend.name is git-gateway, backend.branch is main.
# media_folder / public_folder point at public/images/uploads.
#
# NOTE on the future blog: posts will be stored in MongoDB and served via
# Netlify Functions, not through this CMS/git-gateway — so there is
# intentionally no "Blog" collection here yet. When that ships, blog content
# editing happens through its own admin UI backed by the Functions API, not
# Decap.

backend:
  name: git-gateway
  branch: main

# local_backend:
#   url: http://localhost:8082/api/v1

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - label: "General"
        name: "site"
        file: "src/data/site.json"
        fields:
          - { label: "Business Name", name: "brandName", widget: "string" }
          - {
              label: "Tagline (under logo)",
              name: "tagline",
              widget: "string",
              required: false,
            }
          - { label: "Logo", name: "logo", widget: "image" }
          - label: "Navigation Links"
            name: "nav"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - {
                  label: "Link (section id like #gallery, or a full URL)",
                  name: "href",
                  widget: "string",
                }
          - {
              label: "Book an Event — Button Text",
              name: "bookEventLabel",
              widget: "string",
            }
          - {
              label: "Book an Event — Link",
              name: "bookEventUrl",
              widget: "string",
              hint: "Currently the Google Form. Update this when the owner's new booking flow is ready.",
            }
          - {
              label: "WhatsApp Number (with country code, e.g. +234...)",
              name: "whatsappNumber",
              widget: "string",
              required: false,
            }
          - {
              label: "Contact Email",
              name: "contactEmail",
              widget: "string",
              required: false,
            }
          - {
              label: "Instagram URL",
              name: "instagramUrl",
              widget: "string",
              required: false,
            }
          - {
              label: "Facebook URL",
              name: "facebookUrl",
              widget: "string",
              required: false,
            }
          - {
              label: "Footer Tagline",
              name: "footerTagline",
              widget: "string",
              required: false,
            }

  - name: "home"
    label: "Homepage"
    files:
      - label: "Hero & Section Headings"
        name: "home"
        file: "src/data/home.json"
        fields:
          - {
              label: "Eyebrow (small text above headline)",
              name: "eyebrow",
              widget: "string",
            }
          - {
              label: "Headline — Plain part",
              name: "headlinePlain",
              widget: "string",
              hint: 'e.g. "Mr."',
            }
          - {
              label: "Headline — Accent part (shown in pink)",
              name: "headlineAccent",
              widget: "string",
              hint: 'e.g. "caricature"',
            }
          - {
              label: "Subheadline / Punchline",
              name: "subheadline",
              widget: "string",
              hint: 'e.g. "Caricature in minutes."',
            }
          - { label: "Hero Image", name: "heroImage", widget: "image" }
          - {
              label: "Hero Image Caption",
              name: "heroCaption",
              widget: "string",
              required: false,
            }
          - {
              label: "Gallery Section — Eyebrow",
              name: "galleryEyebrow",
              widget: "string",
              required: false,
            }
          - {
              label: "Gallery Section — Title",
              name: "galleryTitle",
              widget: "string",
              required: false,
            }
          - {
              label: "Packages Section — Eyebrow",
              name: "packagesEyebrow",
              widget: "string",
              required: false,
            }
          - {
              label: "Packages Section — Title",
              name: "packagesTitle",
              widget: "string",
              required: false,
            }

  - name: "about"
    label: "About Page"
    files:
      - label: "About Content"
        name: "about"
        file: "src/data/about.json"
        fields:
          - {
              label: "SEO Title (browser tab / Google title)",
              name: "seoTitle",
              widget: "string",
            }
          - {
              label: "SEO Description (Google search snippet)",
              name: "seoDescription",
              widget: "text",
            }
          - { label: "Page Heading", name: "heading", widget: "string" }
          - {
              label: "Intro Line",
              name: "intro",
              widget: "string",
              required: false,
            }
          - label: "Body Paragraphs"
            name: "bodyParagraphs"
            widget: "list"
            field: { label: "Paragraph", name: "paragraph", widget: "text" }
          - label: "Highlight Badges"
            name: "highlights"
            widget: "list"
            field: { label: "Highlight", name: "highlight", widget: "string" }
          - {
              label: "Artist Image",
              name: "artistImage",
              widget: "image",
              required: false,
            }

  - name: "reaction-video"
    label: "Homepage Reaction Video"
    files:
      - label: "Reaction Video"
        name: "reaction-video"
        file: "src/data/reaction-video.json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Title", name: "title", widget: "string" }
          - {
              label: "YouTube Video ID",
              name: "youtubeId",
              widget: "string",
              hint: "The part after youtube.com/shorts/ or youtu.be/ — e.g. for youtube.com/shorts/C0l-sT04gAo the ID is C0l-sT04gAo. Leave blank to hide this section.",
              required: false,
            }
          - {
              label: "Caption",
              name: "caption",
              widget: "string",
              required: false,
            }

  - name: "spot-on-caricature"
    label: "Spot-On Caricature Page"
    files:
      - label: "Page Content"
        name: "spot-on-caricature"
        file: "src/data/spot-on-caricature.json"
        fields:
          - {
              label: "SEO Title (browser tab / Google title)",
              name: "seoTitle",
              widget: "string",
            }
          - {
              label: "SEO Description (Google search snippet)",
              name: "seoDescription",
              widget: "text",
            }
          - { label: "Page Heading", name: "heading", widget: "string" }
          - { label: "Intro Line", name: "intro", widget: "text" }
          - label: "Sections"
            name: "sections"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }

  - name: "gallery"
    label: "Gallery"
    files:
      - label: "Gallery Slideshow"
        name: "gallery"
        file: "src/data/gallery.json"
        fields:
          - label: "Photos"
            name: "items"
            widget: "list"
            fields:
              - { label: "Photo", name: "image", widget: "image" }
              - {
                  label: "Alt Text (describe the photo)",
                  name: "alt",
                  widget: "string",
                }

  - name: "styles"
    label: "Homepage Style Cards"
    files:
      - label: "Homepage Style Cards"
        name: "styles"
        file: "src/data/styles.json"
        fields:
          - label: "Options"
            name: "items"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - {
                  label: "Note (e.g. Head to Toe)",
                  name: "note",
                  widget: "string",
                  required: false,
                }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Button Text", name: "ctaLabel", widget: "string" }
              - { label: "Button Link", name: "ctaUrl", widget: "string" }

  - name: "style-gallery"
    label: "Style Gallery & Prices"
    files:
      - label: "Style Gallery Page"
        name: "style-gallery"
        file: "src/data/style-gallery.json"
        fields:
          - {
              label: "SEO Title (browser tab / Google title)",
              name: "seoTitle",
              widget: "string",
            }
          - {
              label: "SEO Description (Google search snippet)",
              name: "seoDescription",
              widget: "text",
            }
          - { label: "Eyebrow (small text above the heading)", name: "eyebrow", widget: "string" }
          - { label: "Page Heading", name: "heading", widget: "string" }
          - {
              label: "Intro Text",
              name: "intro",
              widget: "text",
              required: false,
            }
          - {
              label: "Currency Code",
              name: "currency",
              widget: "string",
              default: "NGN",
              hint: "Three-letter code. NGN = Nigerian Naira (₦).",
            }
          - {
              label: "WhatsApp Message — Opening Line",
              name: "orderIntro",
              widget: "text",
              hint: "The first line of the WhatsApp message a customer sends you. The list of styles they picked is added under it automatically.",
            }
          - {
              label: 'Label For "No Fixed Price" Styles',
              name: "quoteLabel",
              widget: "string",
              default: "Ask for a quote",
              hint: "Shown instead of a price whenever a style's price is set to 0.",
            }
          - label: "Styles"
            name: "items"
            widget: "list"
            summary: "{{fields.name}} — {{fields.price}}"
            fields:
              - { label: "Style Name", name: "name", widget: "string" }
              - {
                  label: "Price",
                  name: "price",
                  widget: "number",
                  value_type: "int",
                  min: 0,
                  hint: "Numbers only, no ₦ or commas — e.g. 25000. Enter 0 for styles that need a custom quote.",
                }
              - {
                  label: "Price Note",
                  name: "priceNote",
                  widget: "string",
                  required: false,
                  hint: 'Small text under the price, e.g. "per person" or "from".',
                }
              - { label: "Description", name: "description", widget: "text", required: false }
              - label: "Images"
                name: "images"
                widget: "list"
                fields:
                  - { label: "Image", name: "image", widget: "image" }
                  - {
                      label: "Alt Text (describe the image)",
                      name: "alt",
                      widget: "string",
                      required: false,
                    }

  - name: "clients"
    label: "Companies We've Worked With"
    files:
      - label: "Footer Logo Carousel"
        name: "clients"
        file: "src/data/clients.json"
        fields:
          - {
              label: "Section Title",
              name: "title",
              widget: "string",
              default: "Companies we have worked with",
            }
          - label: "Company Logos"
            name: "items"
            widget: "list"
            summary: "{{fields.name}}"
            hint: "STARTS WITH SIX PLACEHOLDER LOGOS (Northwind, Acme Labs, Lumen, Vertex, Meridian, Orbit) — these are made-up companies, delete them once your real client logos are in. Logos scroll automatically in the footer. For the cleanest look use transparent PNG or SVG files with a similar width. Leave this list empty to hide the whole section."
            fields:
              - {
                  label: "Company Name",
                  name: "name",
                  widget: "string",
                  hint: "Used as the logo's alt text for accessibility and SEO.",
                }
              - { label: "Logo", name: "logo", widget: "image" }
              - {
                  label: "Website (optional)",
                  name: "url",
                  widget: "string",
                  required: false,
                  hint: "Full URL, e.g. https://example.com — leave blank for a non-clickable logo.",
                }
