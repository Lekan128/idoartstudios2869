# public/admin/config.yml
#
# Non-negotiable: backend.name is git-gateway, backend.branch is main.
# media_folder / public_folder point at public/images/uploads.
#
# NOTE on the future blog: posts will be stored in MongoDB and served via
# Netlify Functions, not through this CMS/git-gateway — so there is
# intentionally no "Blog" collection here yet. When that ships, blog content
# editing happens through its own admin UI backed by the Functions API, not
# Decap.

backend:
  name: git-gateway
  branch: main

# local_backend:
#   url: http://localhost:8082/api/v1

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - label: "General"
        name: "site"
        file: "src/data/site.json"
        fields:
          - { label: "Business Name", name: "brandName", widget: "string" }
          - {
              label: "Tagline (under logo)",
              name: "tagline",
              widget: "string",
              required: false,
            }
          - { label: "Logo", name: "logo", widget: "image" }
          - label: "Navigation Links"
            name: "nav"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - {
                  label: "Link (section id like #gallery, or a full URL)",
                  name: "href",
                  widget: "string",
                }
          - {
              label: "Book an Event — Button Text",
              name: "bookEventLabel",
              widget: "string",
            }
          - {
              label: "Book an Event — Link",
              name: "bookEventUrl",
              widget: "string",
              hint: "Where every Book an Event button goes. /spot-on-caricature/#plans opens the event page at the plans (edit them under 'Event Plans & Booking Form'). A full URL (e.g. a Google Form) opens in a new tab instead.",
            }
          - {
              label: "WhatsApp Number (with country code, e.g. +234...)",
              name: "whatsappNumber",
              widget: "string",
              required: false,
            }
          - {
              label: "Contact Email",
              name: "contactEmail",
              widget: "string",
              required: false,
              hint: "Shown on the Contact & Book page and in the footer. Leave blank to hide it.",
            }
          - {
              label: "Instagram URL",
              name: "instagramUrl",
              widget: "string",
              required: false,
              hint: "Full profile link, e.g. https://www.instagram.com/idoartstudios/ — the @handle shown on the site is taken from it.",
            }
          - {
              label: "Facebook URL",
              name: "facebookUrl",
              widget: "string",
              required: false,
            }
          - {
              label: "Footer Tagline",
              name: "footerTagline",
              widget: "string",
              required: false,
            }

  - name: "home"
    label: "Homepage"
    files:
      - label: "Hero & Section Headings"
        name: "home"
        file: "src/data/home.json"
        fields:
          - {
              label: "Eyebrow (small text above headline)",
              name: "eyebrow",
              widget: "string",
            }
          - {
              label: "Headline — Plain part",
              name: "headlinePlain",
              widget: "string",
              hint: 'e.g. "Mr."',
            }
          - {
              label: "Headline — Accent part (shown in pink)",
              name: "headlineAccent",
              widget: "string",
              hint: 'e.g. "caricature"',
            }
          - {
              label: "Subheadline / Punchline",
              name: "subheadline",
              widget: "string",
              hint: 'e.g. "Caricature in minutes."',
            }
          - { label: "Hero Image", name: "heroImage", widget: "image" }
          - {
              label: "Hero Image Caption",
              name: "heroCaption",
              widget: "string",
              required: false,
            }
          - {
              label: "Hero Background Image",
              name: "heroBackgroundImage",
              widget: "image",
              required: false,
              hint: "Photo shown behind the hero section. It is automatically darkened so the text stays readable. Leave empty for the plain pink background.",
            }
          - {
              label: "Hero — Second Button Text",
              name: "orderOnlineLabel",
              widget: "string",
              required: false,
              hint: 'The outlined button next to Book an Event, linking to the online order page. e.g. "Order a caricature online".',
            }
          - {
              label: "Gallery Section — Eyebrow",
              name: "galleryEyebrow",
              widget: "string",
              required: false,
            }
          - {
              label: "Gallery Section — Title",
              name: "galleryTitle",
              widget: "string",
              required: false,
            }
          - {
              label: "Packages Section — Eyebrow",
              name: "packagesEyebrow",
              widget: "string",
              required: false,
            }
          - {
              label: "Packages Section — Title",
              name: "packagesTitle",
              widget: "string",
              required: false,
            }

  - name: "about"
    label: "About Page"
    files:
      - label: "About Content"
        name: "about"
        file: "src/data/about.json"
        fields:
          - {
              label: "SEO Title (browser tab / Google title)",
              name: "seoTitle",
              widget: "string",
            }
          - {
              label: "SEO Description (Google search snippet)",
              name: "seoDescription",
              widget: "text",
            }
          - { label: "Page Heading", name: "heading", widget: "string" }
          - {
              label: "Intro Line",
              name: "intro",
              widget: "string",
              required: false,
            }
          - label: "Body Paragraphs"
            name: "bodyParagraphs"
            widget: "list"
            field: { label: "Paragraph", name: "paragraph", widget: "text" }
          - {
              label: "More About Us — Toggle Label",
              name: "highlightsTitle",
              widget: "string",
              required: false,
              hint: 'Defaults to "More about I Do Art Studios".',
            }
          - label: "More About Us (inside a closed toggle)"
            name: "highlights"
            widget: "list"
            field: { label: "Paragraph", name: "highlight", widget: "text", hint: "Start with a short heading followed by two spaces to show it in bold, e.g. 'International Recognition  Owolabi is…'" }
          - {
              label: "Artist Image",
              name: "artistImage",
              widget: "image",
              required: false,
            }

  - name: "reaction-video"
    label: "Live Caricature Reaction Video"
    files:
      - label: "Reaction Video"
        name: "reaction-video"
        file: "src/data/reaction-video.json"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Title", name: "title", widget: "string" }
          - {
              label: "YouTube Video ID",
              name: "youtubeId",
              widget: "string",
              hint: "The part after youtube.com/shorts/ or youtu.be/ — e.g. for youtube.com/shorts/C0l-sT04gAo the ID is C0l-sT04gAo. Leave blank to hide this section.",
              required: false,
            }
          - {
              label: "Caption",
              name: "caption",
              widget: "string",
              required: false,
            }

  - name: "spot-on-caricature"
    label: "Live Caricature Page (Spot-On Caricature)"
    files:
      - label: "Page Content"
        name: "spot-on-caricature"
        file: "src/data/spot-on-caricature.json"
        fields:
          - {
              label: "SEO Title (browser tab / Google title)",
              name: "seoTitle",
              widget: "string",
            }
          - {
              label: "SEO Description (Google search snippet)",
              name: "seoDescription",
              widget: "text",
            }
          - { label: "Page Heading", name: "heading", widget: "string" }
          - { label: "Intro Line", name: "intro", widget: "text" }
          - label: "Sections"
            name: "sections"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }

  - name: "gallery"
    label: "Gallery"
    files:
      - label: "Gallery Slideshow"
        name: "gallery"
        file: "src/data/gallery.json"
        fields:
          - label: "Photos"
            name: "items"
            widget: "list"
            fields:
              - { label: "Photo", name: "image", widget: "image" }
              - {
                  label: "Alt Text (describe the photo)",
                  name: "alt",
                  widget: "string",
                }

  # Replaces the old "Homepage Style Cards" and "Style Gallery & Prices" collections.
  # Everything the ordering flow shows — the options, the styles, the 3x3 price
  # matrix, the add-ons and the reassurance copy — is edited here, and the homepage
  # cards read the same data so the two can never disagree on price.
  - name: "commission"
    label: "Caricature Prices & Ordering"
    files:
      - label: "Ordering Page"
        name: "commission"
        file: "src/data/commission.json"
        fields:
          - {
              label: "SEO Title (browser tab / Google title)",
              name: "seoTitle",
              widget: "string",
            }
          - {
              label: "SEO Description (Google search snippet)",
              name: "seoDescription",
              widget: "text",
            }
          - { label: "Eyebrow (small text above the heading)", name: "eyebrow", widget: "string" }
          - { label: "Page Heading", name: "heading", widget: "string" }
          - { label: "Intro Text", name: "intro", widget: "text", required: false }
          - {
              label: "Price Badge (under the intro)",
              name: "priceAnchor",
              widget: "string",
              required: false,
              hint: 'Shown as a badge near the top, e.g. "Styles from ₦35,000". Leave blank to show the lowest price automatically.',
            }
          - {
              label: "Pre-selected Style",
              name: "defaultStyle",
              widget: "select",
              required: false,
              options:
                [
                  { label: "Expressive", value: "expressive" },
                  { label: "Classic", value: "classic" },
                  { label: "Realistic", value: "realistic" },
                ],
              hint: "Customers arrive with this style already chosen, so they see a price straight away and can order in one tap. Leave blank to use the style with a badge.",
            }
          - {
              label: "Pre-selected Exaggeration",
              name: "defaultExaggeration",
              widget: "string",
              required: false,
              hint: 'ID of the exaggeration chosen on arrival, e.g. "exaggerated". Leave blank to use the first one listed.',
            }
          - {
              label: "Currency Code",
              name: "currency",
              widget: "string",
              default: "NGN",
              hint: "Three-letter code. NGN = Nigerian Naira (₦).",
            }

          # --- Step 1 ---------------------------------------------------------
          - label: "STEP 1 — What we draw"
            name: "subjects"
            widget: "list"
            summary: "{{fields.name}}"
            hint: "The first choice a customer makes. The ID is used in the price table below and in links — only change it if you also change it everywhere else."
            fields:
              - {
                  label: "ID (no spaces, lowercase)",
                  name: "id",
                  widget: "string",
                  hint: 'e.g. "portrait". Must match the ID used in the Price Table section.',
                }
              - { label: "Name", name: "name", widget: "string" }
              - {
                  label: "Short Tagline",
                  name: "tagline",
                  widget: "string",
                  required: false,
                  hint: 'e.g. "Head and shoulders".',
                }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Example Image", name: "image", widget: "image" }
              - { label: "Alt Text (describe the image)", name: "alt", widget: "string", required: false }
              - {
                  label: "Ask the customer to describe extras?",
                  name: "needsExtras",
                  widget: "boolean",
                  default: false,
                  hint: "Turn on for the option that includes a car, pet, house, hobby etc. The customer gets a box to describe them and the order is flagged for you to confirm the price.",
                }

          # --- Step 2 ---------------------------------------------------------
          - label: "STEP 2 — Exaggeration"
            name: "exaggerations"
            widget: "list"
            summary: "{{fields.name}}"
            hint: "How far the features are pushed. This never changes the price — prices come from the style chosen in the next step. The ID is used in links, so avoid changing it."
            fields:
              - {
                  label: "ID (no spaces, lowercase)",
                  name: "id",
                  widget: "string",
                  hint: 'e.g. "exaggerated".',
                }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Short Tagline", name: "tagline", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Example Image", name: "image", widget: "image" }
              - { label: "Alt Text (describe the image)", name: "alt", widget: "string", required: false }

          # --- Step 3 ---------------------------------------------------------
          - label: "STEP 3 — Artwork styles"
            name: "styles"
            widget: "list"
            summary: "{{fields.name}}"
            hint: "IMPORTANT: the example images should ideally show THE SAME PERSON drawn in all three styles. That single change does more to sell the higher styles than any wording — a customer cannot pay for a difference they cannot see."
            fields:
              - {
                  label: "ID (no spaces, lowercase)",
                  name: "id",
                  widget: "string",
                  hint: 'e.g. "classic". Must match the ID used in the Price Table section.',
                }
              - { label: "Name", name: "name", widget: "string" }
              - {
                  label: "Badge",
                  name: "badge",
                  widget: "string",
                  required: false,
                  hint: 'Ribbon on the card, e.g. "Most popular". Leave blank for no badge.',
                }
              - { label: "Short Tagline", name: "tagline", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text", required: false }
              - {
                  label: '"Best for…" Line',
                  name: "bestFor",
                  widget: "text",
                  required: false,
                  hint: "Tells the customer who this style suits. This is the line that makes the choice easy.",
                }
              - label: "Example Images"
                name: "images"
                widget: "list"
                hint: "Two works best: the full artwork, then a close-up showing the finish."
                fields:
                  - { label: "Image", name: "image", widget: "image" }
                  - { label: "Alt Text", name: "alt", widget: "string", required: false }

          # --- Prices ---------------------------------------------------------
          - label: "PRICE TABLE (per person)"
            name: "pricing"
            widget: "list"
            summary: "{{fields.subject}} + {{fields.style}} — {{fields.price}}"
            hint: "One row per combination. Any combination you leave out (or set to 0) shows as 'Price on request' instead of a number."
            fields:
              - label: "Option"
                name: "subject"
                widget: "select"
                options:
                  - { label: "Portrait", value: "portrait" }
                  - { label: "Full Body", value: "full-body" }
                  - { label: "Full Body + Extras", value: "full-body-extras" }
              - label: "Style"
                name: "style"
                widget: "select"
                options:
                  - { label: "Expressive", value: "expressive" }
                  - { label: "Classic", value: "classic" }
                  - { label: "Realistic", value: "realistic" }
              - {
                  label: "Price (per person)",
                  name: "price",
                  widget: "number",
                  value_type: "int",
                  min: 0,
                  hint: "Numbers only, no ₦ or commas — e.g. 50000. Enter 0 for 'Price on request'.",
                }

          # --- Step 4 ---------------------------------------------------------
          - label: "STEP 4 — Number of people"
            name: "quantities"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "Number", name: "value", widget: "number", value_type: "int", min: 1 }
              - { label: "Button Label", name: "label", widget: "string" }
              - {
                  label: "Price on request?",
                  name: "onRequest",
                  widget: "boolean",
                  default: false,
                  hint: "Turn on for the open-ended top option (e.g. 4 people +). No total is shown and you quote it on WhatsApp.",
                }
          - {
              label: "Notice shown for 'price on request' group sizes",
              name: "quantityOnRequestNotice",
              widget: "text",
            }
          - label: "One artwork or separate artworks?"
            name: "artworkModes"
            widget: "list"
            summary: "{{fields.label}}"
            hint: "Asked whenever more than one person is selected. This is what stops a customer expecting one group piece for the price of two separate ones."
            fields:
              - { label: "ID", name: "id", widget: "string", hint: 'Keep these as "together" and "separate".' }
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Small Print", name: "hint", widget: "string", required: false }

          # --- Reassurance ----------------------------------------------------
          - { label: '"How it works" — Title', name: "howItWorksTitle", widget: "string" }
          - label: '"How it works" — Steps'
            name: "howItWorks"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }
          - { label: '"Before you order" — Title', name: "assuranceTitle", widget: "string" }
          - label: '"Before you order" — Answers'
            name: "assurances"
            widget: "list"
            summary: "{{fields.title}}"
            hint: "CHECK THESE ARE TRUE BEFORE GOING LIVE — the turnaround time, revisions and deposit terms here are starting suggestions, not confirmed policy. These four answers are what stop a sale, so they are worth getting exactly right."
            fields:
              - { label: "Question", name: "title", widget: "string" }
              - { label: "Answer", name: "body", widget: "text" }
          - { label: "Price Table — Title", name: "priceTableTitle", widget: "string" }
          - { label: "Price Table — Note", name: "priceTableNote", widget: "string", required: false }
          - { label: "FAQ — Title", name: "faqTitle", widget: "string" }
          - label: "FAQ — Questions"
            name: "faqs"
            widget: "list"
            summary: "{{fields.question}}"
            hint: "These also appear in Google search results as expandable questions, so write the answers the way a customer would ask them."
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }

          # --- WhatsApp -------------------------------------------------------
          - {
              label: "WhatsApp Message — Opening Line",
              name: "whatsappIntro",
              widget: "text",
              hint: "The customer's selection (type, style, people, total) is added underneath automatically.",
            }
          - { label: "WhatsApp Message — Closing Line", name: "whatsappClosing", widget: "text" }

          # --- Wording --------------------------------------------------------
          - {
              label: "Label for 'Price on request'",
              name: "onRequestLabel",
              widget: "string",
              default: "Price on request",
            }
          - { label: "Step 1 — Heading", name: "subjectStepTitle", widget: "string" }
          - { label: "Step 1 — Hint", name: "subjectStepHint", widget: "string", required: false }
          - { label: "Step 2 — Heading", name: "exaggerationStepTitle", widget: "string" }
          - { label: "Step 2 — Hint", name: "exaggerationStepHint", widget: "string", required: false }
          - { label: "Step 3 — Heading", name: "styleStepTitle", widget: "string" }
          - { label: "Step 3 — Hint", name: "styleStepHint", widget: "string", required: false }
          - { label: "Step 3 — Compare Link Text", name: "styleCompareLabel", widget: "string" }
          - { label: "Step 4 — Heading", name: "quantityStepTitle", widget: "string" }
          - { label: "Step 4 — Hint", name: "quantityStepHint", widget: "string", required: false }
          - { label: "Extras Step — Heading", name: "extrasStepTitle", widget: "string" }
          - { label: "Extras Step — Hint", name: "extrasStepHint", widget: "string", required: false }
          - { label: "Extras Step — Placeholder", name: "extrasPlaceholder", widget: "string", required: false }
          - { label: "Extras Step — Price Notice", name: "extrasPriceNotice", widget: "text" }
          - { label: "Order Summary — Title", name: "summaryTitle", widget: "string" }
          - { label: "Order Button Text", name: "orderCtaLabel", widget: "string" }
          - { label: "Order Button — Small Print", name: "orderCtaHint", widget: "string", required: false }
          - { label: "Order Note — Label", name: "noteLabel", widget: "string" }
          - { label: "Order Note — Placeholder", name: "notePlaceholder", widget: "string", required: false }
          - { label: "Start Over Link Text", name: "startOverLabel", widget: "string" }

  - name: "contact"
    label: "Contact & Book Page"
    files:
      - label: "Contact & Book"
        name: "contact"
        file: "src/data/contact.json"
        fields:
          - { label: "SEO Title (browser tab / Google title)", name: "seoTitle", widget: "string" }
          - { label: "SEO Description (Google search snippet)", name: "seoDescription", widget: "text" }
          - { label: "Eyebrow (small text above the heading)", name: "eyebrow", widget: "string" }
          - { label: "Page Heading", name: "heading", widget: "string" }
          - { label: "Intro Line", name: "intro", widget: "string", required: false }
          - label: "Book an Event Card"
            name: "eventCard"
            widget: "object"
            hint: "The button uses the Book an Event text and link from Site Settings."
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "body", widget: "text" }
          - label: "Commission Card"
            name: "commissionCard"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "body", widget: "text" }
              - { label: "Button Text", name: "buttonLabel", widget: "string", required: false }
          - { label: "Contact Details — Heading", name: "directTitle", widget: "string", hint: "The phone, email and Instagram shown below it come from Site Settings." }
          - { label: "Location Line", name: "location", widget: "string", required: false }

  - name: "event-booking"
    label: "Event Plans & Booking Form"
    files:
      - label: "Plans and Booking Form (Event Caricature page)"
        name: "event-booking"
        file: "src/data/event-booking.json"
        fields:
          - { label: "Plans — Heading", name: "plansTitle", widget: "string" }
          - { label: "Plans — Text Under the Heading", name: "plansHint", widget: "string", required: false }
          - { label: "Currency Code", name: "currency", widget: "string", default: "NGN" }
          - label: "Plans"
            name: "plans"
            widget: "list"
            summary: "{{fields.name}}"
            hint: "Shown in this order. The ID is used by the booking form — keep it short, lowercase, no spaces, and don't change it once live."
            fields:
              - { label: "ID", name: "id", widget: "string", hint: 'e.g. "classic"' }
              - { label: "Name", name: "name", widget: "string", hint: 'e.g. "Classic Experience"' }
              - { label: "Badge", name: "badge", widget: "string", required: false, hint: 'e.g. "Most popular". Leave blank for none — use it on one plan at most.' }
              - { label: "One-line Description", name: "tagline", widget: "string", required: false, hint: "Shown on the card under the name." }
              - { label: "Description", name: "description", widget: "text", required: false, hint: "One or two sentences at the top of the plan's details (opened from 'See all inclusions' or a photo)." }
              - label: "Full Event"
                name: "fullEvent"
                widget: "object"
                fields:
                  - { label: "Price", name: "price", widget: "number", value_type: "int", min: 0, hint: "Numbers only, no ₦ or commas — e.g. 1000000. Enter 0 to show 'On request'." }
                  - { label: "Small Print", name: "note", widget: "string", required: false, hint: 'e.g. "Up to 60 T-shirts". Leave blank for none.' }
              - label: "Hourly"
                name: "hourly"
                widget: "object"
                hint: "The shorter booking, shown on the right of the Full event / Per hour switch in the booking form."
                fields:
                  - { label: "Price", name: "price", widget: "number", value_type: "int", min: 0, hint: "Per hour, or the fixed price for the hours below — see 'Priced'." }
                  - label: "Priced"
                    name: "unit"
                    widget: "select"
                    default: "hour"
                    options:
                      - { label: "Per hour (the form shows the price for the minimum hours)", value: "hour" }
                      - { label: "Fixed price for the hours below", value: "package" }
                  - { label: "Hours (minimum, or the package length)", name: "hours", widget: "number", value_type: "int", min: 1, default: 2 }
                  - { label: "Small Print", name: "note", widget: "string", required: false, hint: 'e.g. "Up to 20 T-shirts". Per-hour plans show "Minimum 2 hours" automatically when this is blank.' }
              - { label: "Guests Served", name: "capacity", widget: "string", required: false, hint: 'e.g. "Approx. 20–30 guests / 2 hours". Shown on the card and in the details.' }
              - { label: "What's Included — Lead-in", name: "includesIntro", widget: "string", required: false, hint: 'Optional line above the list, e.g. "Everything in Platinum, plus:"' }
              - label: "What's Included"
                name: "features"
                widget: "list"
                required: false
                hint: "Short points, most important first — the card shows the first three, the details show them all."
                field: { label: "Point", name: "feature", widget: "string" }
              - label: "Example Photos"
                name: "images"
                widget: "list"
                required: false
                summary: "{{fields.alt}}"
                hint: "Guests with their caricatures at real events. The first shows on the card; they rotate every 4 seconds and open full screen when tapped. Two or three is ideal — mix men and women. Portrait photos work best."
                fields:
                  - { label: "Photo", name: "image", widget: "image" }
                  - { label: "Photo Description (alt text)", name: "alt", widget: "string", required: false }
          - { label: "Form — Heading (no plan chosen)", name: "formTitle", widget: "string" }
          - { label: "Form — Heading (plan chosen)", name: "formTitleWithPlan", widget: "string", hint: "{plan} is replaced with the plan's name." }
          - { label: "Form — Text Under the Heading", name: "formHint", widget: "string", required: false }
          - { label: "Form — 'Not sure yet' Option", name: "notSureLabel", widget: "string" }
          - label: "Form — Kinds of Event"
            name: "eventTypes"
            widget: "list"
            field: { label: "Kind of event", name: "eventType", widget: "string" }
          - { label: "Form — Button Text", name: "sendLabel", widget: "string" }
          - { label: "Form — Text Under the Button", name: "sendHint", widget: "string", required: false }
          - { label: "After Sending — Heading", name: "sentTitle", widget: "string", hint: "{name} is replaced with the customer's first name." }
          - { label: "After Sending — Message", name: "sentBody", widget: "text" }
          - { label: "What Happens Next — Title", name: "nextStepsTitle", widget: "string" }
          - label: "What Happens Next — Steps"
            name: "nextSteps"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }
          - { label: "Why Book Us — Title", name: "whyTitle", widget: "string", hint: "Heading above the three points edited under 'Live Caricature Page'." }
          - { label: "WhatsApp Message — Opening Line", name: "whatsappIntro", widget: "text", hint: "The details the customer entered are added underneath automatically." }

  - name: "clients"
    label: "Companies We've Worked With"
    files:
      - label: "Footer Logo Carousel"
        name: "clients"
        file: "src/data/clients.json"
        fields:
          - {
              label: "Section Title",
              name: "title",
              widget: "string",
              default: "Companies we have worked with",
            }
          - label: "Company Logos"
            name: "items"
            widget: "list"
            summary: "{{fields.name}}"
            hint: "STARTS WITH SIX PLACEHOLDER LOGOS (Northwind, Acme Labs, Lumen, Vertex, Meridian, Orbit) — these are made-up companies, delete them once your real client logos are in. Logos scroll automatically in the footer. For the cleanest look use transparent PNG or SVG files with a similar width. Leave this list empty to hide the whole section."
            fields:
              - {
                  label: "Company Name",
                  name: "name",
                  widget: "string",
                  hint: "Used as the logo's alt text for accessibility and SEO.",
                }
              - { label: "Logo", name: "logo", widget: "image" }
              - {
                  label: "Website (optional)",
                  name: "url",
                  widget: "string",
                  required: false,
                  hint: "Full URL, e.g. https://example.com — leave blank for a non-clickable logo.",
                }
